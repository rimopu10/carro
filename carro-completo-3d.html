<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El carro completo — modelo de ensamble</title>
<style>
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:#0a0d12;overflow:hidden;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#c9d1d9}
 #app{position:fixed;inset:0}
 .panel{background:#11151bee;border:1px solid #262d38;border-radius:13px;padding:12px 14px;
  font-size:12px;line-height:1.55;backdrop-filter:blur(10px);box-shadow:0 6px 24px #0006}
 #izq{position:fixed;top:12px;left:12px;z-index:10;display:flex;flex-direction:column;gap:9px;
  width:290px;max-height:calc(100vh - 24px);overflow-y:auto;scrollbar-width:thin}
 #der{position:fixed;top:12px;right:12px;z-index:10;width:300px;display:flex;
  flex-direction:column;gap:9px;max-height:calc(100vh - 24px);overflow-y:auto}
 h1{color:#f0f6fc;font-size:15.5px;margin:0 0 4px;letter-spacing:-.01em}
 h2{color:#7d8590;font-size:10px;margin:0 0 8px;text-transform:uppercase;
  letter-spacing:.1em;font-weight:650}
 .sis{display:flex;align-items:center;gap:9px;padding:4px 6px;border-radius:7px;cursor:pointer;
  transition:background .12s}
 .sis:hover{background:#1a2029}
 .sis.off{opacity:.3}
 .chip{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 0 1px #0006 inset}
 .sis .n{margin-left:auto;color:#636c76;font-size:10.5px;font-variant-numeric:tabular-nums}
 button{background:#1a2029;color:#c9d1d9;border:1px solid #2b3441;border-radius:8px;
  padding:6px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:all .12s}
 button:hover{background:#232b36;border-color:#3a4552}
 button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
 .row{display:flex;flex-wrap:wrap;gap:5px}
 input[type=range]{width:100%;accent-color:#1f6feb;margin:2px 0}
 .lbl{display:flex;justify-content:space-between;color:#7d8590;font-size:10.5px;margin-top:9px}
 #ptit{color:#f0f6fc;font-weight:650;font-size:13px}
 #pfase{background:#1f6feb22;color:#58a6ff;border-radius:5px;padding:1px 6px;font-size:10px;
  margin-left:6px;font-weight:600}
 #pdesc{color:#8b949e;font-size:11.5px;margin-top:6px}
 #pchk{margin:9px 0 0;padding:0;list-style:none}
 #pchk li{position:relative;padding-left:17px;margin-bottom:5px;color:#adbac7;font-size:11px}
 #pchk li::before{content:"";position:absolute;left:3px;top:6px;width:6px;height:6px;
  border-radius:2px;background:#f59e0b}
 #info{display:none}
 #info .t{color:#f0f6fc;font-weight:650;font-size:13.5px;line-height:1.35}
 #info .s{color:#8b949e;font-size:11.5px;margin-top:6px}
 #info .tag{display:inline-block;margin-top:9px;padding:2px 8px;border-radius:6px;
  font-size:10px;background:#1a2029;font-weight:600}
 #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;
  color:#636c76;font-size:11px;background:#11151bee;border:1px solid #262d38;
  border-radius:9px;padding:6px 15px}
 b{color:#e6edf3}
 code{background:#1a2029;padding:1px 5px;border-radius:4px;font-size:10.5px;color:#7ee787}
</style></head><body>
<div id="app"></div>

<div id="izq">
 <div class="panel">
  <h1>🏎️ El carro completo</h1>
  <div id="stats"></div>
 </div>
 <div class="panel">
  <h2>Secuencia de armado</h2>
  <div><span id="ptit"></span><span id="pfase"></span></div>
  <div id="pdesc"></div>
  <ul id="pchk"></ul>
  <div class="lbl"><span>Paso</span><span id="pnum"></span></div>
  <input type="range" id="rpaso" min="1" max="7" value="7">
 </div>
 <div class="panel">
  <h2>Vista</h2>
  <div class="row" style="margin-bottom:7px">
   <button id="vi" class="on">Iso</button><button id="vl">Lateral</button>
   <button id="vf">Frontal</button><button id="vs">Superior</button>
  </div>
  <div class="row">
   <button id="brot" class="on">⟳ Girar</button>
   <button id="bcar">Carrocería</button>
   <button id="bxray">Rayos X</button>
  </div>
  <div class="lbl"><span>Vista explotada</span><span id="lexp">0%</span></div>
  <input type="range" id="rexp" min="0" max="100" value="0">
 </div>
</div>

<div id="der">
 <div class="panel">
  <h2>Sistemas — clic para ocultar</h2>
  <div id="lista"></div>
 </div>
 <div class="panel" id="info">
  <div class="t"></div><div class="s"></div><div class="tag"></div>
 </div>
</div>
<div id="hint">Clic en cualquier pieza para ver qué es · arrastra para girar · rueda para acercar</div>

function forma(ext,ints,cirs,esc){

 s.closePath();

  l.forEach((p,i)=>i?h.lineTo(p[0]*esc,p[1]*esc):h.moveTo(p[0]*esc,p[1]*esc));

}

const cacheV={};
function geoVoxel(tipo,mir){
 const k=tipo+(mir?'R':'L'); if(cacheV[k])return cacheV[k];
 const nd=D.voxels[tipo], e=0.15/Math.max(nd.nelx,nd.nely,nd.nelz);
 const cx=nd.nelx/2,cy=nd.nely/2,cz=nd.nelz/2, set=new Set();
 for(const v of nd.vox) set.add(v[0]+v[1]*64+v[2]*4096);
 const hay=(x,y,z)=>x>=0&&y>=0&&z>=0&&x<nd.nelx&&y<nd.nely&&z<nd.nelz&&set.has(x+y*64+z*4096);
 const P=[],add=p=>P.push((p[0]-cx)*e,(p[1]-cy)*e,(mir?-(p[2]-cz):(p[2]-cz))*e);
 for(const v of nd.vox){const[ix,iy,iz]=v;
  for(const[d0,q0] of CARAS){ if(hay(ix+d0[0],iy+d0[1],iz+d0[2]))continue;
   const q=q0.map(o=>[ix+o[0],iy+o[1],iz+o[2]]);
   if(mir){add(q[0]);add(q[2]);add(q[1]);add(q[0]);add(q[3]);add(q[2]);}
   else{add(q[0]);add(q[1]);add(q[2]);add(q[0]);add(q[2]);add(q[3]);}}}
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); g.computeVertexNormals();
 return cacheV[k]=g;
}

  p.position.z=z; g.add(p);}
 const nip=malla(new THREE.CylinderGeometry(0.004,0.004,0.020,8),MAT.acero('#cfd6de'));
 nip.position.set(0,0.050,-0.020); g.add(nip);
 g.rotation.z=ang-Math.PI/2; if(s<0)g.scale.z=-1;
 return g;
}
function bBrazoA(p1,p2,ap,r){
 const g=new THREE.Group();
 for(const p of [p1,p2]){
  const t=malla(new THREE.CylinderGeometry(r,r,1,16),MAT.pintado('#ea7317'));
  const L=orientar(t,p,ap); t.scale.y=L; g.add(t);
  const o=malla(new THREE.CylinderGeometry(r*1.5,r*1.5,0.052,16),MAT.acero('#9aa5b1'));
  orientar(o,p,ap); o.position.copy(V(p)); g.add(o);}
 const boss=malla(new THREE.CylinderGeometry(0.020,0.020,0.040,18),MAT.acero('#9aa5b1'));
 boss.position.copy(V(ap)); g.add(boss);
 return g;
}
function bMangueta(lbj,ubj,cubo,tr,s){
 const g=new THREE.Group();
 const cuerpo=malla(new THREE.CylinderGeometry(0.020,0.026,1,16),MAT.crudo('#7d8894'));
 const L=orientar(cuerpo,lbj,ubj); cuerpo.scale.y=L; g.add(cuerpo);
 const med=[(lbj[0]+ubj[0])/2,(lbj[1]+ubj[1])/2,(lbj[2]+ubj[2])/2];
 const bh=malla(new THREE.CylinderGeometry(0.046,0.046,0.058,26),MAT.crudo('#8d97a3'));
 orientar(bh,med,cubo); bh.position.copy(V(cubo)); bh.rotation.set(Math.PI/2,0,0);
 if(s<0)bh.scale.z=-1; g.add(bh);
 const br=malla(new THREE.CylinderGeometry(0.013,0.013,1,12),MAT.crudo('#7d8894'));
 const L2=orientar(br,med,tr); br.scale.y=L2; g.add(br);
 const cn=malla(new THREE.CylinderGeometry(0.017,0.017,0.06,14),MAT.crudo('#8d97a3'));
 orientar(cn,med,cubo); g.add(cn);
 return g;
}
function bTieRod(L,r){
 const b=malla(new THREE.CylinderGeometry(r,r,L*0.74,14),MAT.acero('#cbd5e1'));
 const e=(y)=>{const o=malla(new THREE.TorusGeometry(0.013,0.007,10,16),MAT.acero('#94a3b8'));
  o.position.y=y; o.rotation.y=Math.PI/2;
  const c=malla(new THREE.CylinderGeometry(r*1.5,r*1.5,0.03,12),MAT.acero('#94a3b8'));
  c.position.y=y*0.80; return G(o,c);};
 return G(b,e(L*0.44),e(-L*0.44));
}
function bCremallera(L,r){
 const cu=malla(new THREE.CylinderGeometry(r,r,L*0.62,20),MAT.acero('#8d97a3'));
 const pi=malla(new THREE.CylinderGeometry(r*1.5,r*1.5,0.07,18),MAT.acero('#6b7683'));
 pi.position.y=-L*0.14; pi.rotation.z=Math.PI/2;
 const fu=(y)=>{const f=malla(new THREE.CylinderGeometry(r*0.75,r*0.6,L*0.16,16),
  MAT.hule('#20252c')); f.position.y=y; return f;};
 return G(cu,pi,fu(L*0.39),fu(-L*0.39));
}
function bColumna(L,r){
 const t=malla(new THREE.CylinderGeometry(r,r,L*0.86,14),MAT.acero('#9aa5b1'));
 const j=malla(new THREE.BoxGeometry(r*2.6,r*2.6,r*2.6),MAT.acero('#6b7683'));
 j.position.y=L*0.46;
 return G(t,j);
}
function bVolante(R){
 const g=new THREE.Group();
 const aro=malla(new THREE.TorusGeometry(R,0.017,14,44),MAT.hule('#191d23'));
 g.add(aro);
 for(let i=0;i<3;i++){
  const a=(i*2*Math.PI/3)-Math.PI/2;
  const r=malla(new THREE.BoxGeometry(R*0.86,0.020,0.010),MAT.acero('#5f6b78'));
  r.position.set(R*0.43*Math.cos(a),R*0.43*Math.sin(a),0); r.rotation.z=a; g.add(r);}
 const mz=malla(new THREE.CylinderGeometry(0.036,0.036,0.032,20),MAT.acero('#4b5563'));
 mz.rotation.x=Math.PI/2; g.add(mz);
 g.rotation.y=Math.PI/2; g.rotation.z=-0.30;
 return g;
}
function bPedal(h){
 const br=malla(new THREE.BoxGeometry(0.016,h,0.028),MAT.acero('#9aa5b1'));
 const pl=malla(new THREE.BoxGeometry(0.020,0.075,0.050),MAT.hule('#20252c'));
 pl.position.y=h/2; pl.rotation.z=0.12;
 const pv=malla(new THREE.CylinderGeometry(0.010,0.010,0.05,12),MAT.acero('#6b7683'));
 pv.position.y=-h/2; pv.rotation.z=Math.PI/2;
 const g=G(br,pl,pv); g.rotation.z=-0.22; return g;
}
function bBomba(L,r){
 const cu=malla(new THREE.CylinderGeometry(r,r,L,20),MAT.acero('#b6bfc9'));
 const dp=malla(new THREE.CylinderGeometry(r*0.8,r*0.8,0.055,16),MAT.plastico('#e5e7eb'));
 dp.position.set(0,L*0.22,r*1.3); dp.rotation.x=Math.PI/2;
 const va=malla(new THREE.CylinderGeometry(r*0.28,r*0.28,L*0.5,12),MAT.acero('#e8edf2'));
 va.position.y=-L*0.6;
 return G(cu,dp,va);
}
function bButaca(){
 const g=new THREE.Group();
 const co=malla(new THREE.BoxGeometry(0.48,0.085,0.44),MAT.plastico('#2b313b'));
 co.position.y=0.045; g.add(co);
 const re=malla(new THREE.BoxGeometry(0.10,0.62,0.44),MAT.plastico('#2b313b'));
 re.position.set(0.31,0.34,0); re.rotation.z=0.40; g.add(re);
 const ca=malla(new THREE.BoxGeometry(0.09,0.14,0.24),MAT.plastico('#232830'));
 ca.position.set(0.44,0.63,0); ca.rotation.z=0.40; g.add(ca);
 for(const z of [-0.17,0.17]) for(const x of [-0.19,0.19]){
  const p=malla(new THREE.BoxGeometry(0.05,0.09,0.04),MAT.acero('#8d97a3'));
  p.position.set(x,-0.02,z); g.add(p);}
 return g;
}
function bArnes(){
 const g=new THREE.Group();
 const cin=(a,b,w)=>{const t=malla(new THREE.BoxGeometry(w,1,0.006),MAT.plastico('#b91c1c'));
  const L=orientar(t,a,b); t.scale.y=L; return t;};
 g.add(cin([0.30,0.70,0.19],[0.02,0.10,0.06],0.045));
 g.add(cin([0.30,0.70,-0.19],[0.02,0.10,-0.06],0.045));
 g.add(cin([-0.20,0.05,0.20],[0.02,0.09,0.05],0.045));
 g.add(cin([-0.20,0.05,-0.20],[0.02,0.09,-0.05],0.045));
 const he=malla(new THREE.BoxGeometry(0.075,0.075,0.022),MAT.acero('#cbd5e1'));
 he.position.set(0.02,0.09,0); g.add(he);
 return g;
}
function bCeldas(sz){
 const c=malla(new THREE.BoxGeometry(sz[0],sz[1],sz[2]),MAT.plastico('#166534'));
 const t=(z)=>{const p=malla(new THREE.CylinderGeometry(0.008,0.008,0.014,12),
  MAT.acero('#e2b13c')); p.position.set(0,sz[1]/2,z); return p;};
 return G(c,t(sz[2]*0.3),t(-sz[2]*0.3));
}
function bCajaBat(sz){
 const g=new THREE.Group();
 const cj=malla(new THREE.BoxGeometry(sz[0],sz[1],sz[2]),
  new THREE.MeshStandardMaterial({color:new THREE.Color('#16a34a'),metalness:0.5,
   roughness:0.5,transparent:true,opacity:0.30,side:THREE.DoubleSide}));
 g.add(cj);
 for(const x of [-sz[0]/2,sz[0]/2]) for(const z of [-sz[2]/2,sz[2]/2]){
  const e=malla(new THREE.BoxGeometry(0.02,sz[1],0.02),MAT.acero('#15803d'));
  e.position.set(x,0,z); g.add(e);}
 return g;
}

/* ---------------- construir todas las piezas ---------------- */
const objetos=[];
const CENTRO=new THREE.Vector3(1.5,0.45,0);
for(const p of D.piezas){
 let o=null;
 const m=()=>MAT.acero(p.col);
 switch(p.t){
  case 'tubo_c':{o=malla(new THREE.BoxGeometry(p.w,1,p.w),MAT.crudo(p.col));
   const L=orientar(o,p.a,p.b); o.scale.y=L; break;}
  case 'tubo_rect':{o=malla(new THREE.BoxGeometry(p.w,1,p.h),MAT.pintado(p.col));
   const L=orientar(o,p.a,p.b); o.scale.y=L; break;}
  case 'tubo_r': case 'cil':{o=malla(new THREE.CylinderGeometry(p.r,p.r,1,18),MAT.crudo(p.col));
   const L=orientar(o,p.a,p.b); o.scale.y=L; break;}
  case 'esfera':{o=malla(new THREE.SphereGeometry(p.r,18,13),MAT.crudo(p.col));
   o.position.set(...p.pos); break;}
  case 'caja':{o=malla(new THREE.BoxGeometry(...p.size),MAT.plastico(p.col));
   o.position.set(...p.pos); break;}
  case 'voxel':{o=malla(geoVoxel(p.tipo,p.mir),mat(p.col,0.55,0.42,{flatShading:true}));
   o.position.set(...p.pos); break;}
  case 'malla':{const g=new THREE.BufferGeometry();
   g.setAttribute('position',new THREE.Float32BufferAttribute(p.tris,3)); g.computeVertexNormals();
   o=new THREE.Mesh(g,mat(p.col,0.15,0.24,{transparent:true,opacity:0.14,
    side:THREE.DoubleSide,depthWrite:false})); break;}
  case 'perfil':{const pf=D.perfiles[p.perfil]; if(!pf)break;
   const g=new THREE.ExtrudeGeometry(forma(pf.ext,pf.int,pf.cir,0.001),
    {depth:p.esp,bevelEnabled:true,bevelThickness:0.0006,bevelSize:0.0006,bevelSegments:1});
   g.translate(0,0,-p.esp/2);
   o=malla(g,MAT.crudo(p.col)); o.position.set(...p.pos); o.rotation.z=p.rotz; break;}
  case 'brazo_a': o=bBrazoA(p.p1,p.p2,p.ap,p.r); break;
  case 'mangueta': o=bMangueta(p.lbj,p.ubj,p.cubo,p.tr,p.s); break;
  case 'rotula':{o=bRotula(); o.position.set(...p.pos);
   o.quaternion.setFromUnitVectors(UP,V(p.dir).normalize()); break;}
  case 'buje':{o=bBuje(p.d,p.L); o.position.set(...p.pos);
   o.quaternion.setFromUnitVectors(UP,V(p.dir).normalize()); break;}
  case 'tornillo':{o=bTornillo(p.d,p.L,p.col); o.position.set(...p.pos);
   o.quaternion.setFromUnitVectors(UP,V(p.dir).normalize()); break;}
  case 'coilover':{const L=V(p.b).sub(V(p.a)).length();
   o=bCoilover(L,p.rc,p.rb,p.hilo,p.vueltas,p.col); orientar(o,p.a,p.b); break;}
  case 'rueda':{o=bRueda(p.R,p.W,p.Rr,p.rayos,p.s); o.position.set(...p.pos); break;}
  case 'motor':{o=bMotor(p.R,p.W,p.s); o.position.set(...p.pos); break;}
  case 'disco':{o=bDisco(p.R,p.Rh,p.t_,p.s); o.position.set(...p.pos); break;}
  case 'caliper':{o=bCaliper(p.Rd,p.ang,p.s); o.position.set(...p.pos); break;}
  case 'tierod':{const L=V(p.b).sub(V(p.a)).length(); o=bTieRod(L,p.r); orientar(o,p.a,p.b); break;}
  case 'cremallera':{const L=V(p.b).sub(V(p.a)).length(); o=bCremallera(L,p.r);
   orientar(o,p.a,p.b); break;}
  case 'columna':{const L=V(p.b).sub(V(p.a)).length(); o=bColumna(L,p.r);
   orientar(o,p.a,p.b); break;}
  case 'volante':{o=bVolante(p.R); o.position.set(...p.pos); break;}
  case 'pedal':{o=bPedal(p.h); o.position.set(...p.pos); break;}
  case 'bomba':{o=bBomba(p.L,p.r); o.position.set(...p.pos);
   o.quaternion.setFromUnitVectors(UP,V(p.dir).normalize()); break;}
  case 'butaca':{o=bButaca(); o.position.set(...p.pos); break;}
  case 'arnes':{o=bArnes(); o.position.set(...p.pos); break;}
  case 'celda':{o=bCeldas(p.size); o.position.set(...p.pos); break;}
  case 'caja_bat':{o=bCajaBat(p.size); o.position.set(...p.pos); break;}
  case 'cable':{const cv=new THREE.CatmullRomCurve3(p.pts.map(V));
   o=malla(new THREE.TubeGeometry(cv,64,p.r,10,false),MAT.hule(p.col)); break;}
 }
 if(!o)continue;
 o.traverse(c=>{if(!c.isMesh)return;
  c.castShadow=p.sis!=='carroceria'; c.receiveShadow=true;
  // se guarda la transparencia original para que rayos X no arruine las piezas
  // que ya eran translúcidas a propósito (carrocería, caja de batería)
  c.material.userData.tr=c.material.transparent;
  c.material.userData.op=c.material.opacity;});
 o.userData.p=p;
 const base=o.position.clone();
 let dir=p.exp?V(p.exp):base.clone().sub(CENTRO).normalize();
 if(dir.lengthSq()<1e-6)dir=new THREE.Vector3(0,1,0);
 scene.add(o); objetos.push({o,p,base,dir});
}

/* ---------------- interfaz ---------------- */
const S=D.stats;
document.getElementById('stats').innerHTML=
 `<b>${S.n_piezas} piezas</b> en coordenadas reales<br>`+
 `${S.largo} × ${S.ancho} × ${S.alto} m · batalla ${S.batalla} m<br>`+
 `Chasis: <b>${S.n_tubos} tubos</b>, ${S.masa_chasis} kg, ${S.ktors.toLocaleString()} N·m/°<br>`+
 `Masa objetivo: <b>${S.masa_total} kg</b> con 2 ocupantes`;

const apagados=new Set(['carroceria']);
const lista=document.getElementById('lista'), filas={};
for(const s of D.sistemas){
 const r=document.createElement('div'); r.className='sis'+(apagados.has(s.id)?' off':'');
 r.innerHTML=`<span class="chip" style="background:${s.col}"></span><span>${s.nom}</span><span class="n">${s.n}</span>`;
 r.onclick=()=>{r.classList.toggle('off');
  apagados.has(s.id)?apagados.delete(s.id):apagados.add(s.id); sincro(); refrescar();};
 lista.appendChild(r); filas[s.id]=r;
}
let paso=7, explosion=0;
const rp=document.getElementById('rpaso');
function pintarPaso(){
 const i=D.pasos.find(x=>x.n===paso);
 document.getElementById('ptit').textContent=`${i.n}. ${i.tit}`;
 document.getElementById('pfase').textContent=i.fase;
 document.getElementById('pdesc').textContent=i.desc;
 document.getElementById('pnum').textContent=`${paso} de 7`;
 const ul=document.getElementById('pchk'); ul.innerHTML='';
 for(const c of i.chk){const li=document.createElement('li');li.textContent=c;ul.appendChild(li);}
}
rp.oninput=()=>{paso=+rp.value;pintarPaso();refrescar();};
document.getElementById('rexp').oninput=e=>{explosion=+e.target.value/100;
 document.getElementById('lexp').textContent=e.target.value+'%'; refrescar();};
function refrescar(){
 for(const x of objetos){
  x.o.visible=!apagados.has(x.p.sis)&&x.p.paso<=paso;
  x.o.position.copy(x.base).addScaledVector(x.dir,explosion*0.9);
 }
}
function sincro(){
 document.getElementById('bcar').classList.toggle('on',!apagados.has('carroceria'));
}
pintarPaso(); refrescar(); sincro();

document.getElementById('brot').onclick=e=>{ctr.autoRotate=!ctr.autoRotate;
 e.target.classList.toggle('on',ctr.autoRotate);};
document.getElementById('bcar').onclick=()=>{
 apagados.has('carroceria')?apagados.delete('carroceria'):apagados.add('carroceria');
 filas['carroceria'].classList.toggle('off',apagados.has('carroceria')); sincro(); refrescar();};
let xray=false;
document.getElementById('bxray').onclick=e=>{xray=!xray;e.target.classList.toggle('on',xray);
 for(const x of objetos){ if(x.p.sis==='carroceria')continue;
  x.o.traverse(c=>{if(!c.isMesh)return;
   c.material.transparent=xray||c.material.userData?.tr;
   c.material.opacity=xray?0.20:(c.material.userData?.op??1);
   c.material.depthWrite=!xray; c.castShadow=!xray; c.material.needsUpdate=true;});}};

const VISTAS={vi:[4.9,2.0,3.8],vl:[1.5,0.9,7.0],vf:[7.2,1.2,0.01],vs:[1.55,7.0,0.02]};
for(const k in VISTAS) document.getElementById(k).onclick=e=>{
 ['vi','vl','vf','vs'].forEach(q=>document.getElementById(q).classList.toggle('on',q===k));
 const v=VISTAS[k]; cam.position.set(v[0],v[1],v[2]); ctr.target.set(1.5,0.44,0);};

/* ---------------- inspección por clic ---------------- */
const ray=new THREE.Raycaster(), mou=new THREE.Vector2();
const info=document.getElementById('info');
let sel=null;
function resaltar(o,on){o.traverse(c=>{if(c.isMesh){
 c.material.emissive=new THREE.Color(on?0x1f6feb:0x000000);
 c.material.emissiveIntensity=on?0.6:0;}});}
addEventListener('pointerdown',ev=>{
 if(ev.target!==rnd.domElement)return;
 mou.x=(ev.clientX/innerWidth)*2-1; mou.y=-(ev.clientY/innerHeight)*2+1;
 ray.setFromCamera(mou,cam);
 const vis=objetos.filter(x=>x.o.visible&&x.p.sis!=='carroceria').map(x=>x.o);
 const h=ray.intersectObjects(vis,true);
 if(sel){resaltar(sel,false);sel=null;}
 if(!h.length){info.style.display='none';return;}
 let o=h[0].object; while(o.parent&&!o.userData.p)o=o.parent;
 if(!o.userData.p){info.style.display='none';return;}
 sel=o; resaltar(sel,true);
 const p=o.userData.p, s=D.sistemas.find(x=>x.id===p.sis);
 info.style.display='block';
 info.querySelector('.t').textContent=p.nom;
 info.querySelector('.s').innerHTML=p.spec.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/`(.+?)`/g,'<code>$1</code>');
 const tg=info.querySelector('.tag');
 tg.textContent=`${s.nom} · se monta en el paso ${p.paso}`; tg.style.color=s.col;
});

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
 rnd.setSize(innerWidth,innerHeight);});
rnd.setAnimationLoop(()=>{ctr.update();rnd.render(scene,cam);});
</script></body></html>
